name: SpacePick web worker
# Dedicated executor for administrator web intake (web_worker.py).
# Each run serves the queue for up to ~50 minutes and then stops gracefully
# (SIGTERM -> current job result is saved). The schedule keeps one run queued
# so the next run starts as soon as the previous one ends.
# The legacy worker runs unless WEB_WORKER_ENABLED is explicitly 'false'.
# V2 queue processing remains off unless INTAKE_V2_ENABLED is 'true'.
on:
  push:
    branches: [main]
    paths:
      - web_worker.py
      - image_worker.py
      - analysis_worker.py
      - sales_analysis.py
      - .github/workflows/web-worker.yml
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: spacepick-web-worker
  cancel-in-progress: false
jobs:
  serve:
    if: ${{ vars.WEB_WORKER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web-worker.txt
      - name: Serve web queue (values are never printed)
        env:
          WEB_WORKER_ENABLED: 'true'
          INTAKE_V2_ENABLED: ${{ vars.INTAKE_V2_ENABLED || 'false' }}
          INTAKE_V2_ONLY: ${{ vars.INTAKE_V2_ONLY || 'false' }}
          WORKER_ENVIRONMENT: production
          WORKER_PROJECT_REF: aklcylhqslgntkgloqpi
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'gemini,openai,anthropic' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-terra' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          WEB_API_IMAGES_ENABLED: 'false'
        run: |
          # 50 min of service, then SIGTERM; web_worker saves in-flight results (up to 6 min grace).
          timeout --signal=TERM --kill-after=360 3000 python -u web_worker.py || code=$?
          # 124 = normal timeout stop
          if [ "${code:-0}" != "0" ] && [ "${code:-0}" != "124" ]; then exit "$code"; fi
