name: Telegram intake read-only diagnostic
on:
  push:
    branches: [audit/telegram-intake-20261106]
    paths:
      - .github/workflows/telegram-intake-diagnostic.yml
      - scripts/diagnose_telegram_intake.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      verdict: ${{ steps.health.outputs.verdict }}
      delivery: ${{ steps.health.outputs.delivery }}
    steps:
      - uses: actions/checkout@v4
      - name: Check existing intake bindings without changing data
        id: health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Screenshot: Nov 6, 17:34 KST. Time-only lookup; no test-word assumption.
          INTAKE_WINDOW_START: '2026-11-06T08:32:00+00:00'
          INTAKE_WINDOW_END: '2026-11-06T08:36:00+00:00'
        run: python3 scripts/diagnose_telegram_intake.py
  result:
    needs: diagnose
    name: "Intake diagnostic — ${{ needs.diagnose.outputs.verdict }}"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Read-only checks complete
        run: python3 -c "print('No messages sent; no webhook, queue or customer data changed.')"
  delivery:
    needs: diagnose
    name: "Delivery options — ${{ needs.diagnose.outputs.delivery }}"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Read-only delivery checks complete
        run: python3 -c "print('Bot names are compared by fingerprint; no username or token is published.')"
