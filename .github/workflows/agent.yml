name: Real Estate AI Marketing Agent

on:
  # 1. 텔레그램에서 새 매물이 들어왔을 때 즉시 실행 (Webhook 트리거)
  repository_dispatch:
    types: [new_property]
  
  # 2. 즉시 트리거 유실과 일시 오류 복구 (DB가 최대5회·대기시간을 제어)
  schedule:
    - cron: '3,18,33,48 * * * *'
  
  # 3. 수동 테스트용 버튼
  workflow_dispatch:

# 한 번에 하나의 분석 작업만 실행하여 매물 중복 분석 방지
# 동일 그룹에서 실행 중인 작업은 취소하지 않고, 신규 작업은 대기
concurrency:
  group: real-estate-ai-agent-main
  cancel-in-progress: false

jobs:
  run-marketing-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치 및 패키지 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install supabase==2.33.0 google-genai==2.34.0 requests==2.34.2 pydantic==2.14.2

      - name: 무인 부동산 분석 및 마케팅 봇 가동
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python -u analysis_worker.py
