name: Showroom read-only credential preflight
on:
  push:
    branches: [audit/showroom-preflight-20261103]
    paths: [.github/workflows/showroom-credential-preflight.yml]
permissions: {}
jobs:
  credential-role:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classify server credential and verify same-project HEAD access
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Classify an existing server credential and make one HEAD request.
          
          Never prints the credential, URL, response body, exception text or environment.
          The JWT classification does not verify its signature; the HEAD checks API access.
          """
          import base64
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, HTTPRedirectHandler, build_opener
          
          PROJECT = "aklcylhqslgntkgloqpi"
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def classify(key):
              if not isinstance(key, str) or not key:
                  return "missing"
              if key.startswith("sb_secret_"):
                  return "server_secret"
              if key.startswith("sb_publishable_"):
                  return "browser_publishable"
              try:
                  parts = key.split(".")
                  if len(parts) != 3:
                      return "unknown"
                  payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
                  if payload.get("ref") != PROJECT:
                      return "wrong_project"
                  if payload.get("role") == "service_role":
                      return "server_service_role"
                  if payload.get("role") == "anon":
                      return "browser_anon"
              except (ValueError, TypeError, UnicodeError):
                  pass
              return "unknown"
          
          
          def main():
              key = os.environ.get("SUPABASE_KEY", "")
              kind = classify(key)
              print("Credential classification:", kind)
              if kind not in ("server_secret", "server_service_role"):
                  print("Preflight blocked: a server credential is required before hardening.")
                  return 1
              parsed = urlparse(os.environ.get("SUPABASE_URL", ""))
              if parsed.scheme != "https" or parsed.hostname != f"{PROJECT}.supabase.co":
                  print("Preflight blocked: project URL does not match the audited project.")
                  return 1
              headers = {"apikey": key}
              if kind == "server_service_role":
                  headers["Authorization"] = "Bearer " + key
              request = Request(f"https://{PROJECT}.supabase.co/rest/v1/properties?select=id&limit=0", headers=headers, method="HEAD")
              try:
                  with build_opener(NoRedirect()).open(request, timeout=20) as response:
                      if response.status not in (200, 206):
                          print("Preflight blocked: unexpected HEAD status.")
                          return 1
              except HTTPError as error:
                  print("Preflight blocked: HEAD HTTP status", error.code)
                  return 1
              except (URLError, OSError):
                  print("Preflight blocked: HEAD transport failed.")
                  return 1
              print("Read-only HEAD access: passed. No data body fetched.")
              return 0
          
          
          if __name__ == "__main__":
              sys.exit(main())
          PY

